<!doctype html>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }

    font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
    color: #f4f1ff;

  .stars { position: absolute; inset: 0; }
  .wrap { position: absolute; left: 110px; top: 150px; width: 820px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 22px; border-radius: 999px;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18);
    font-size: 24px; letter-spacing: 2px; color: #d9d2ff;
  }
  .badge i { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 12px #4ade80; }
  h1 {
    margin-top: 34px; font-size: 118px; line-height: 1.1; font-weight: 800; letter-spacing: 4px; white-space: nowrap;
    background: linear-gradient(100deg, #fff 0%, #e9e2ff 45%, #ffd27a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 60px rgba(167, 139, 250, .25);
  }
  .sub { margin-top: 22px; font-size: 38px; color: #cfc8ff; letter-spacing: 3px; }
  .sub b { color: #ffd27a; font-weight: 700; }
  .chips { margin-top: 52px; display: flex; gap: 14px; flex-wrap: nowrap; }
  .chip {
    padding: 14px 22px; border-radius: 16px; font-size: 26px; font-weight: 600; white-space: nowrap;
    background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .14);
  }
  .chip em { font-style: normal; color: #ffd27a; font-size: 30px; margin-right: 6px; }
  .cta { margin-top: 64px; display: flex; align-items: center; gap: 26px; }
  .cmd {
    padding: 18px 34px; border-radius: 18px; font-size: 40px; font-weight: 800;
    font-family: "SF Mono", Menlo, monospace; color: #1b1640;
    background: linear-gradient(135deg, #ffe08a, #ffb84d); box-shadow: 0 12px 40px rgba(255, 184, 77, .35);
  }
  .url { font-size: 30px; color: #bfb7f5; letter-spacing: 1px; }
  .url span { display: block; font-size: 22px; color: #8f87c9; margin-bottom: 6px; letter-spacing: 3px; }
  .owl { position: absolute; right: 70px; top: 40px; width: 720px; height: 820px; }
  .foot { position: absolute; left: 110px; bottom: 44px; font-size: 21px; color: #8f87c9; letter-spacing: 2px; }
